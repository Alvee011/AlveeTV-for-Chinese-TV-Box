<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d24"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#512da8"/>
    </linearGradient>
  </defs>
  <!-- Remote Body Outline -->
  <rect x="136" y="32" width="240" height="448" rx="56" fill="url(#bg)" stroke="#2b2d38" stroke-width="8"/>
  <!-- Power Button -->
  <circle cx="184" cy="92" r="22" fill="#e53935"/>
  <path d="M184 80 v12 M174 86 a13 13 0 1 0 20 0" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Top Buttons -->
  <circle cx="184" cy="156" r="22" fill="#23242c" stroke="#353744" stroke-width="2"/>
  <rect x="174" y="148" width="20" height="3" rx="1.5" fill="#ffffff"/>
  <rect x="174" y="154" width="20" height="3" rx="1.5" fill="#ffffff"/>
  <rect x="174" y="160" width="20" height="3" rx="1.5" fill="#ffffff"/>
  <circle cx="328" cy="156" r="22" fill="#23242c" stroke="#353744" stroke-width="2"/>
  <path d="M318 162 v-8 l10 -8 l10 8 v8 z" fill="#ffffff"/>
  <!-- D-Pad Purple Ring -->
  <circle cx="256" cy="256" r="72" fill="url(#purple)"/>
  <circle cx="256" cy="256" r="32" fill="#4527a0" stroke="#7c4dff" stroke-width="2"/>
  <text x="256" y="262" font-family="-apple-system, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">OK</text>
  <!-- Back Button -->
  <rect x="176" y="356" width="160" height="36" rx="18" fill="#23242c" stroke="#353744" stroke-width="2"/>
  <path d="M266 374 h-22 l6 -6 m-6 6 l6 6" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Volume & Mouse -->
  <circle cx="184" cy="424" r="20" fill="#23242c"/>
  <text x="184" y="429" font-family="-apple-system, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">-</text>
  <circle cx="328" cy="424" r="20" fill="#23242c"/>
  <text x="328" y="429" font-family="-apple-system, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">+</text>
  <circle cx="256" cy="424" r="20" fill="url(#purple)"/>
  <!-- Mouse Icon -->
  <rect x="250" y="415" width="12" height="18" rx="6" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="256" y1="418" x2="256" y2="422" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>

